{% extends "posts/base.html" %}

{% block title %}Eliminar post · Blog de Dante{% endblock %}

{% block masthead %}
<div class="page-heading">
    <h1>Eliminar post</h1>
</div>
{% endblock %}

{% block content %}
<p>¿Seguro que querés eliminar <strong>«{{ post.titulo }}»</strong>? Esta acción no se puede deshacer.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger text-uppercase">Sí, eliminar</button>
    <a href="{{ post.get_absolute_url }}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
